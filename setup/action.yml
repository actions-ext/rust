name: Setup Rust
description: 'Configure a Rust toolchain, targets, components, and caching'

inputs:
  toolchain:
    description: 'Rust toolchain to install'
    default: 'stable'
  components:
    description: 'Comma-separated rustup components to install'
    default: 'clippy,rustfmt'
  targets:
    description: 'Comma-separated Rust targets to install'
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # latest
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Configure Cargo cache paths
      run: |
        if [ -z "${CARGO_TARGET_DIR:-}" ]; then
          echo "CARGO_TARGET_DIR=${GITHUB_WORKSPACE}/target" >> "${GITHUB_ENV}"
        fi
        echo "CARGO_TERM_COLOR=always" >> "${GITHUB_ENV}"
      shell: bash

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        key: ${{ inputs.toolchain }}-${{ inputs.targets }}
        cache-targets: true
        cache-all-crates: true
        cache-bin: true
        cache-on-failure: true
        cache-directories: |
          .cargo
          .rustup
